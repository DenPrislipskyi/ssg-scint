name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        # Vite bakes these into the bundle at build time, and the build happens
        # inside this action - so they have to be here. `.env` is gitignored and
        # never reaches the runner, which is why the deployed site was serving
        # fixtures: with VITE_API_MODE unset, the app falls back to `mock`.
        #
        # `hybrid`, not `http`: the agent serves the RFQ list and the matching
        # screen, and nothing else yet. `http` would point the catalogue and
        # supplier screens at endpoints that do not exist.
        #
        # The URL is a repository variable so that a new backend host is a
        # setting rather than a commit. The literal is the fallback, because an
        # unset variable would otherwise build a bundle that calls its own
        # origin and fails at runtime with nothing to point at.
        env:
          VITE_API_MODE: hybrid
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://rfq-agent-container.niceriver-2680c12c.eastus.azurecontainerapps.io/api/v1' }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_CLIFF_0B1CD8403 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_CLIFF_0B1CD8403 }}
          action: "close"
